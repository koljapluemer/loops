<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}loops cms{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .checker {
      background-color: #fff;
      background-image: conic-gradient(#e5e5e5 25%, transparent 0 50%, #e5e5e5 0 75%, transparent 0);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 shadow-sm px-4">
    <a href="{{ url_for('index') }}" class="text-lg font-semibold">loops cms</a>
  </div>
  <main class="max-w-7xl mx-auto p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div role="alert" class="alert alert-{{ category }} alert-soft mb-4">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
